# Reference Apache vhost for the hosted Swarm Lobby — dashboard SPA + backend on one domain.
# Referenced by .github/workflows/deploy.yml (the lobby deploy step).
#
# The SPA is served straight from the lobby git checkout (same commit as the backend — one
# git pull updates both, no skew). Everything the Node backend owns is proxied to 127.0.0.1:4730:
# the REST control plane, the agent WebSocket, hosted agent-card metadata, and /health.
#
# Required modules:  a2enmod proxy proxy_http proxy_wstunnel
# (TLS directives — SSLEngine/SSLCertificateFile or certbot includes — omitted here; keep
# whatever your existing 443 vhost already has.)
#
# ORDERING PITFALL (the classic way this breaks): ProxyPass matching is first-match-wins in
# file order. If your vhost (e.g. Virtualmin-managed) uses a catch-all `ProxyPass /` to the
# backend, the WebSocket rule below MUST appear above it — otherwise the catch-all forwards
# the handshake as plain HTTP (Upgrade/Connection are hop-by-hop and get stripped) and the
# backend answers 404 instead of 101. The same applies to `ProxyPass /.well-known !` —
# exclusions placed after the catch-all do nothing. Catch-all variant:
#     ProxyPass        /api/v1/agent-lobby/ws/agent ws://127.0.0.1:4730/api/v1/agent-lobby/ws/agent
#     ProxyPassReverse /api/v1/agent-lobby/ws/agent ws://127.0.0.1:4730/api/v1/agent-lobby/ws/agent
#     ProxyPass /.well-known !
#     ProxyPass / http://127.0.0.1:4730/
#     ProxyPassReverse / http://127.0.0.1:4730/
# (The backend serves the SPA itself, so DocumentRoot is unused in that variant. On Apache
# >= 2.4.47, `ProxyPass / http://127.0.0.1:4730/ upgrade=websocket` folds both into one rule.)

<VirtualHost *:443>
    ServerName lobby.agent-os.gothard.dk

    # SPA from the deploy checkout: ${SSH_PATH_LOBBY}/apps/lobby-web
    DocumentRoot "/home/lobby/agent-os-protocol/apps/lobby-web"

    ProxyPreserveHost On

    # 1) Agent WebSocket — MUST come before the general API ProxyPass below: ProxyPass
    #    matching is first-match-wins, and the general http:// rule would otherwise forward
    #    the handshake as plain HTTP (Upgrade/Connection are hop-by-hop headers Apache
    #    strips), which the backend answers with a JSON 404 instead of a 101 upgrade.
    #    The ws:// scheme requires mod_proxy_wstunnel.
    ProxyPass        /api/v1/agent-lobby/ws/agent ws://127.0.0.1:4730/api/v1/agent-lobby/ws/agent
    ProxyPassReverse /api/v1/agent-lobby/ws/agent ws://127.0.0.1:4730/api/v1/agent-lobby/ws/agent

    # On Apache >= 2.4.47 the two rules above can instead be folded into the general rule:
    #   ProxyPass /api/v1/agent-lobby/ http://127.0.0.1:4730/api/v1/agent-lobby/ upgrade=websocket

    # 2) REST control plane (discover, lobbies, stats, registry proxy, ...)
    ProxyPass        /api/v1/agent-lobby/ http://127.0.0.1:4730/api/v1/agent-lobby/
    ProxyPassReverse /api/v1/agent-lobby/ http://127.0.0.1:4730/api/v1/agent-lobby/

    # 3) Hosted agent-card metadata — the backend returns short /agent-cards/<did> URLs
    ProxyPass        /agent-cards/ http://127.0.0.1:4730/agent-cards/
    ProxyPassReverse /agent-cards/ http://127.0.0.1:4730/agent-cards/

    # 4) Health probe (uptime monitoring; also what the deploy pipeline checks on the box)
    ProxyPass        /health http://127.0.0.1:4730/health
    ProxyPassReverse /health http://127.0.0.1:4730/health

    <Directory "/home/lobby/agent-os-protocol/apps/lobby-web">
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>
</VirtualHost>
