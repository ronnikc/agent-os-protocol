#
# Deploy the static sites (apps/website + apps/lobby-web) over SSH.
# Each app has its own SSH user + private key (same host), and is synced with
# rsync into its own remote path:
#   ${SSH_USER_WEBSITE}@${SSH_HOST}:${SSH_PATH_WEBSITE}  <- apps/website
#   ${SSH_USER_LOBBY}@${SSH_HOST}:${SSH_PATH_LOBBY}      <- apps/lobby-web
#
# Required repository secrets:
#   SSH_HOST                 server hostname or IP (shared)
#   SSH_PORT                 ssh port, e.g. 22 (shared)
#   SSH_USER_WEBSITE         ssh user for the website
#   SSH_PRIVATE_KEY_WEBSITE  private key (PEM) for the website user
#   SSH_PATH_WEBSITE         absolute path on the server for the website
#   SSH_USER_LOBBY           ssh user for the lobby-web dashboard
#   SSH_PRIVATE_KEY_LOBBY    private key (PEM) for the lobby-web user
#   SSH_PATH_LOBBY           absolute path on the server for the lobby-web dashboard

name: Deploy sites

on:
  push:
    branches: [main]
    paths:
      - 'apps/website/**'
      - 'apps/lobby-web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-sites
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY_WEBSITE }}" > ~/.ssh/website_key
          echo "${{ secrets.SSH_PRIVATE_KEY_LOBBY }}" > ~/.ssh/lobby_key
          chmod 600 ~/.ssh/website_key ~/.ssh/lobby_key
          ssh-keyscan -p "${{ secrets.SSH_PORT }}" -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy website
        run: |
          ssh -i ~/.ssh/website_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER_WEBSITE }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.SSH_PATH_WEBSITE }}'"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/website_key -p ${{ secrets.SSH_PORT }}" \
            apps/website/ \
            "${{ secrets.SSH_USER_WEBSITE }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH_WEBSITE }}/"

      - name: Deploy lobby-web
        run: |
          ssh -i ~/.ssh/lobby_key -p "${{ secrets.SSH_PORT }}" \
            "${{ secrets.SSH_USER_LOBBY }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.SSH_PATH_LOBBY }}'"
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/lobby_key -p ${{ secrets.SSH_PORT }}" \
            apps/lobby-web/ \
            "${{ secrets.SSH_USER_LOBBY }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_PATH_LOBBY }}/"

      - name: Clean up SSH keys
        if: always()
        run: rm -f ~/.ssh/website_key ~/.ssh/lobby_key
